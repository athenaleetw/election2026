<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中壢區議員開票即時</title>
<style>
/* 淺米黃底＋鮮明政黨色：民進黨＝綠、國民黨＝藍、無黨籍＝灰（慣例） */
:root{
  --page:#d8d0c2;
  --stage:linear-gradient(180deg,#f3eee5 0%,#e9e2d5 100%);
  --top:linear-gradient(90deg,#f7f3ec,#f1ebe0); --topline:#d3c9b8;
  --panel:#faf7f1; --panel2:#f1ebe0; --line:#d9cfbe;
  --ink:#38332c; --mute:#7c7467; --track:#e4dccd;
  --gold:#e3b100; --goldtxt:#8a6500; --goldbg:#fbf1c9;
  --dpp:#16934a; --dpp-d:#0f7a3b; --dpp-s:#dff3e6; --dpp-l:#6fcf96;
  --kmt:#1f6fd6; --kmt-d:#1559b0; --kmt-s:#dfeafb; --kmt-l:#7db2f0;
  --ind:#6f7b87; --ind-d:#4f5a65; --ind-s:#e8ebee; --ind-l:#aab4be;
  --prog:#3f3a33;
}
.p-dpp{--pc:var(--dpp);--pd:var(--dpp-d);--ps:var(--dpp-s);--pl:var(--dpp-l)}
.p-kmt{--pc:var(--kmt);--pd:var(--kmt-d);--ps:var(--kmt-s);--pl:var(--kmt-l)}
.p-ind{--pc:var(--ind);--pd:var(--ind-d);--ps:var(--ind-s);--pl:var(--ind-l)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;background:var(--stage);overflow:hidden;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
/* 頂部 */
#top{position:absolute;left:0;top:0;width:1920px;height:132px;padding:0 48px;display:flex;align-items:center;gap:40px;border-bottom:2px solid var(--topline);background:var(--top)}
#top .tt{flex:1;min-width:0}
#top h1{margin:0;font-size:50px;font-weight:800;letter-spacing:2px;line-height:1.15;white-space:nowrap}
#top .sub{font-size:24px;color:var(--mute);margin-top:4px}
#live{display:inline-flex;align-items:center;gap:8px;margin-left:16px;font-size:22px;color:var(--dpp-d);font-weight:700;vertical-align:middle}
#live i{width:14px;height:14px;border-radius:50%;background:var(--dpp);animation:pulse 1.4s infinite}
#live.stale{color:var(--goldtxt)} #live.stale i{background:var(--gold);animation:none}
@keyframes pulse{50%{opacity:.25}}
.prog{width:760px}
.prog .row1{display:flex;align-items:baseline;gap:14px}
.prog .lab{font-size:26px;color:var(--mute)}
.prog .big{font-size:78px;font-weight:800;color:var(--ink);line-height:1}
.prog .of{font-size:30px;color:var(--mute)}
.prog .pct{margin-left:auto;font-size:52px;font-weight:800;color:var(--prog)}
.pbar{height:18px;border-radius:99px;background:var(--track);margin-top:10px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6b655b,var(--prog));border-radius:99px;transition:width 1s}
/* 面板 */
.panel{position:absolute;top:152px;height:852px;border-radius:22px;background:var(--panel);border:2px solid var(--line);box-shadow:0 2px 10px rgba(90,75,50,.06)}
#pl{left:40px;width:868px}
#pr{left:932px;width:948px}
.ph{height:62px;padding:0 26px;display:flex;align-items:center;gap:14px;font-size:30px;font-weight:800;border-bottom:2px solid var(--line)}
.ph small{font-size:21px;color:var(--mute);font-weight:500;margin-left:auto}
.ph .tag{border-radius:10px;padding:2px 14px;font-size:24px;color:#fff;background:var(--dpp)}
.ph .tag.o{background:#4a453d}
.body{position:absolute;left:0;right:0;top:62px;bottom:0}
.item{position:absolute;left:14px;right:14px;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
/* 我方卡片 */
.card{height:188px;border-radius:18px;background:linear-gradient(135deg,var(--ps),#f4f1e8);border:2px solid var(--pl);padding:16px 24px;display:flex;flex-direction:column;justify-content:space-between}
.card.in{border-color:var(--gold);box-shadow:0 0 0 2px rgba(196,154,44,.22) inset}
.c1{display:flex;align-items:center;gap:20px}
.bd{min-width:84px;height:84px;border-radius:20px;background:var(--pc);color:#fff;font-size:54px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 8px}
.nm{font-size:62px;font-weight:900;line-height:1;letter-spacing:2px}
.pt{font-size:22px;color:var(--pd);font-weight:700;margin-top:6px}
.rkbox{margin-left:auto;text-align:right}
.votes{font-size:84px;font-weight:900;line-height:1;color:var(--ink)}
.share{font-size:28px;color:var(--pd);font-weight:800;margin-top:2px}
.c2{display:flex;align-items:center;gap:18px}
.tr{flex:1;height:24px;border-radius:99px;background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px var(--pl);overflow:hidden}
.tr i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--pl),var(--pc));transition:width 1s}
.rk{font-size:30px;font-weight:800;white-space:nowrap;min-width:230px;text-align:right}
.rk b{font-size:38px}
.rk.in{color:var(--goldtxt)} .rk.out{color:var(--mute)}
/* 其他列 */
.orow{height:56px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;gap:14px;padding:0 18px}
.orow.in{background:var(--goldbg);box-shadow:inset 6px 0 0 var(--gold)}
.orow .rk2{width:46px;text-align:center;font-size:30px;font-weight:800;color:var(--mute)}
.orow.in .rk2{color:var(--goldtxt)}
.orow .bd2{min-width:48px;height:40px;border-radius:10px;background:var(--pc);color:#fff;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px}
.orow .nm2{width:190px;font-size:34px;font-weight:800;white-space:nowrap}
.orow .pt2{width:128px;font-size:19px;font-weight:700;color:var(--pd);background:var(--ps);border-radius:8px;display:flex;align-items:center;justify-content:center;gap:6px;padding:3px 0;white-space:nowrap}
.em{height:34px;width:34px;object-fit:contain;flex:none;vertical-align:middle;background:#fff;border-radius:50%;box-shadow:0 0 0 1.5px rgba(60,50,35,.22)}
.orow .pt2 .em{height:24px;width:24px}
.pt{display:flex;align-items:center;gap:8px}
#foot .em{height:20px;width:20px}
.orow .tr2{flex:1;height:20px;border-radius:99px;background:var(--track);overflow:hidden}
.orow.in .tr2{background:#eadfbf}
.orow .tr2 i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--pl),var(--pc));transition:width 1s}
.orow .v2{width:150px;text-align:right;font-size:36px;font-weight:800}
.orow .s2{width:96px;text-align:right;font-size:24px;color:var(--pd);font-weight:700}
/* 底部 */
#foot{position:absolute;left:0;bottom:0;width:1920px;height:60px;padding:0 48px;display:flex;align-items:center;gap:26px;font-size:21px;color:var(--mute);border-top:2px solid var(--topline);background:#f3eee5}
#foot b{color:var(--ink)}
#foot .leg{display:flex;align-items:center;gap:8px;white-space:nowrap}
#foot .sw{width:22px;height:14px;border-radius:3px}
#foot .r{margin-left:auto}
/* 未開放 */
#closed{position:absolute;inset:0;background:rgba(243,238,229,.97);display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center;z-index:5}
#closed .a{font-size:110px}
#closed .b{font-size:64px;font-weight:900}
#closed .c{font-size:32px;color:var(--mute);line-height:1.6}
.ctl{position:fixed;right:12px;top:12px;z-index:20;opacity:0;transition:opacity .3s}
body:hover .ctl{opacity:.9}
.ctl button{background:rgba(60,50,35,.75);color:#fff;border:0;border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div class="ctl"><button id="qa" title="查各里／投開票所" onclick="location.href='query.html'">查詢各里</button> <button id="fs" title="全螢幕（F）">全螢幕</button></div>
<div id="stage">
  <div id="top">
    <div class="tt"><h1><span id="title">中壢區議員開票即時</span><span id="live"><i></i><span id="livetxt">連線中</span></span></h1><div class="sub" id="sub"></div></div>
    <div class="prog">
      <div class="row1"><span class="lab">已開出</span><span class="big num" id="rep">0</span><span class="of num">／ <span id="tot">270</span> 所</span><span class="pct num" id="pct">0.0%</span></div>
      <div class="pbar"><i id="pbar"></i></div>
    </div>
  </div>
  <div class="panel" id="pl"><div class="ph"><span class="tag">民進黨提名</span><span id="plt">民進黨四位</span><small id="pls"></small></div><div class="body" id="plb"></div></div>
  <div class="panel" id="pr"><div class="ph"><span class="tag o">其他候選人</span><span id="prt"></span><small>依目前得票排序</small></div><div class="body" id="prb"></div></div>
  <div id="foot">
    <span class="leg"><span class="sw" style="background:var(--dpp)"></span><img class="em" src="img/dpp.svg" alt="">民主進步黨</span>
    <span class="leg"><span class="sw" style="background:var(--kmt)"></span><img class="em" src="img/kmt.svg" alt="">國民黨</span>
    <span class="leg"><span class="sw" style="background:var(--ind)"></span>無黨籍</span>
    <span>已統計有效票 <b class="num" id="valid">0</b></span>
    <span class="r">志工現場回報，非官方結果，以中選會公告為準　｜　資料時間 <span id="upd">--:--:--</span></span>
  </div>
  <div id="closed"><div class="a">🗳️</div><div class="b">投票結束、開票後開放查看</div><div class="c" id="closedmsg"></div></div>
</div>

<script src="config.js"></script>
<script src="data.js"></script>
<script>
(function(){
const API=(window.ELECTION_API||'').trim(), DEMO=!API;
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('zh-TW');
const hms=t=>{const d=new Date(t);return [d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':')};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pcls=p=>/民進/.test(p)?'p-dpp':/國民/.test(p)?'p-kmt':'p-ind';
const emb=p=>/民進/.test(p)?'<img class="em" src="img/dpp.svg" alt="">':/國民/.test(p)?'<img class="em" src="img/kmt.svg" alt="">':'';

/* 手機直立（窄螢幕）自動改看直式的查詢頁；網址加 ?tv=1 可強制看電視版面 */
if(!/[?&]tv=1/.test(location.search) && matchMedia('(max-width:760px) and (orientation:portrait)').matches){ location.replace('query.html'); }

/* 縮放 16:9 舞台 */
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);$('stage').style.transform=`scale(${s}) translate(-50%,-50%)`;}
addEventListener('resize',fit);fit();
$('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();};
addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')$('fs').click();});

/* 數字滾動 */
const shown=new WeakMap();
function count(el,to,f){
  f=f||fmt; const from=shown.has(el)?shown.get(el):0; shown.set(el,to);
  if(from===to){el.textContent=f(to);return;}
  const t0=performance.now(),dur=900;
  (function step(){const k=Math.max(0,Math.min(1,(performance.now()-t0)/dur)),e=1-Math.pow(1-k,3);el.textContent=f(from+(to-from)*e);if(k<1)requestAnimationFrame(step);else el.textContent=f(to);})();
}

/* 示範資料 */
let demoState=null;
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function demoPayload(){
  const dd=window.DEMO_DATA;
  if(!demoState){
    const R=rng(20261128);
    const w=dd.cands.map(c=>c.ours?1.2+R()*0.9:0.5+R()*1.4), bias={};
    const st=dd.stations.map(s=>{if(!(s[1] in bias))bias[s[1]]=dd.cands.map(()=>0.6+R()*0.9);const tot=650+Math.floor(R()*650),ws=w.map((x,i)=>x*bias[s[1]][i]*(0.7+R()*0.6)),sw=ws.reduce((a,b)=>a+b,0);return{s,votes:ws.map(x=>Math.round(tot*x/sw)),inv:Math.floor(R()*14)}});
    demoState={st,order:st.map((_,i)=>i).sort(()=>R()-.5),n:Math.round(st.length*.42)};
  }
  const S=demoState; S.n=Math.min(S.st.length,S.n+Math.floor(2+Math.random()*5));
  const done=new Set(S.order.slice(0,S.n)),v=dd.cands.map(()=>0);let valid=0,inv=0;
  S.st.forEach((x,i)=>{if(done.has(i)){x.votes.forEach((y,j)=>v[j]+=y);valid+=x.votes.reduce((a,b)=>a+b,0);inv+=x.inv;}});
  return{ok:true,status:'open',title:'2026 桃園市議員選舉 中壢區 開票即時',sub:'第 7 選舉區（中壢區）　應選 11 席',seats:11,cands:dd.cands,updated:Date.now(),total:S.st.length,reported:S.n,valid,invalid:inv,v};
}

/* 建立元素（每位候選人一個，之後只更新內容與位置） */
let D=null,els=null,lastOk=0,failing=false;
const PL=$('plb'),PR=$('prb'),CH=188,CG=12,RH=56,RG=4;
function build(){
  PL.innerHTML='';PR.innerHTML='';els={};
  D.cands.forEach(c=>{
    const e=document.createElement('div');e.className='item '+pcls(c.party);
    if(c.ours){
      e.innerHTML=`<div class="card"><div class="c1"><div class="bd">${c.no}</div><div><div class="nm">${esc(c.name)}</div><div class="pt">${emb(c.party)}${esc(/民進/.test(c.party)?'民主進步黨':c.party)}</div></div>
        <div class="rkbox"><div class="votes num">0</div><div class="share num">0.0%</div></div></div>
        <div class="c2"><div class="tr"><i></i></div><div class="rk"></div></div></div>`;
      PL.appendChild(e);
    }else{
      e.innerHTML=`<div class="orow"><div class="rk2 num"></div><div class="bd2">${c.no}</div><div class="nm2">${esc(c.name)}</div><div class="pt2">${emb(c.party)}${esc(c.party)}</div>
        <div class="tr2"><i></i></div><div class="v2 num">0</div><div class="s2 num">0.0%</div></div>`;
      PR.appendChild(e);
    }
    els[c.no]=e;
  });
  const n1=D.cands.filter(c=>c.ours).length,n2=D.cands.length-n1;
  $('prt').textContent=n2+' 位';
  $('plt').textContent=n1+' 位候選人';
}
function render(){
  $('title').textContent=D.title||'開票即時';
  // 演練標示：投票結束前（開放時間之前）就顯示票數＝演練模式，明確標示「非真實票數」，避免截圖外流被誤認
  const REH=!DEMO&&D.status==='open'&&D.openAt&&Date.now()<new Date(D.openAt).getTime();
  const tag=t=>'　<span style="color:#946a08;font-weight:800;background:#f1e2bd;border-radius:6px;padding:0 8px">'+t+'</span>';
  $('sub').innerHTML=esc(D.sub||'')+(DEMO?tag('示範資料・假數字'):REH?tag('演練資料・非真實票數'):'');
  if(D.status==='closed'){
    $('closed').style.display='flex';
    let t='';if(D.openAt){const d=new Date(D.openAt);if(!isNaN(d))t=`預計 ${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} 起提供即時票數`;}
    $('closedmsg').innerHTML=esc(t)+'<br>本頁會自動更新';return;
  }
  $('closed').style.display='none';
  if(!els||Object.keys(els).length!==D.cands.length)build();
  const seats=D.seats||0, any=D.reported>0;
  const rows=D.cands.map((c,i)=>({c,v:D.v[i]}));
  const sorted=[...rows].sort((a,b)=>b.v-a.v||a.c.no-b.c.no);
  const rank={};sorted.forEach((x,i)=>{rank[x.c.no]=1+sorted.filter(y=>y.v>x.v).length;});
  const max=Math.max(1,sorted[0].v);
  const cut=sorted[seats-1]?sorted[seats-1].v:0, next=sorted[seats]?sorted[seats].v:0;
  let li=0,ri=0;
  sorted.forEach((x,idx)=>{
    const c=x.c,e=els[c.no],inSeat=any&&idx<seats;
    const pos=c.ours?li++:ri++;
    e.style.transform=`translateY(${c.ours?pos*(CH+CG):pos*(RH+RG)}px)`;
    e.querySelector('i').style.width=(x.v/max*100)+'%';
    const share=D.valid?x.v/D.valid*100:0;
    if(c.ours){
      e.querySelector('.card').classList.toggle('in',inSeat);
      count(e.querySelector('.votes'),x.v);
      count(e.querySelector('.share'),share,v=>v.toFixed(1)+'%');
      const rk=e.querySelector('.rk');rk.className='rk '+(inSeat?'in':'out');
      rk.innerHTML=any?`目前第 <b class="num">${rank[c.no]}</b> 名`:'尚未開票';
    }else{
      e.querySelector('.orow').classList.toggle('in',inSeat);
      e.querySelector('.rk2').textContent=any?rank[c.no]:'–';
      count(e.querySelector('.v2'),x.v);
      count(e.querySelector('.s2'),share,v=>v.toFixed(1)+'%');
    }
  });
  count($('rep'),D.reported);$('tot').textContent=D.total;
  const p=D.total?D.reported/D.total*100:0;count($('pct'),p,v=>v.toFixed(1)+'%');$('pbar').style.width=p+'%';
  count($('valid'),D.valid);$('upd').textContent=hms(D.updated);
  const ours=D.cands.map((c,i)=>c.ours?D.v[i]:0).reduce((a,b)=>a+b,0);
  $('pls').textContent=any&&D.valid?`合計 ${fmt(ours)} 票　${(ours/D.valid*100).toFixed(1)}%`:'';
  live();
}
function live(){
  const l=$('live');
  if(D&&D.status==='open'){
    const stale=failing||Date.now()-lastOk>90000;
    l.classList.toggle('stale',stale);$('livetxt').textContent=stale?'連線不穩':'即時';
  }else{$('livetxt').textContent='';}
}
setInterval(live,5000);

async function load(){
  try{
    let d;
    if(DEMO)d=demoPayload();
    else{const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),15000);try{d=await (await fetch(API+'?action=pub&_='+Date.now(),{signal:ctl.signal})).json();}finally{clearTimeout(t);}}
    if(!d||!d.ok)throw new Error('bad');
    D=d;lastOk=Date.now();failing=false;render();
  }catch(e){failing=true;live();}
  clearTimeout(TM); TM=setTimeout(load,DEMO?4000:(document.hidden?30000:5000));   // 畫面開著每 5 秒取一次（後端結果每 10 秒更新）；切到背景放慢為 30 秒
}
let TM=null;
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ clearTimeout(TM); load(); } });   // 切回來馬上更新
load();
})();
</script>
</body>
</html>
